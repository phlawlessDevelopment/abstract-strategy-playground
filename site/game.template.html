<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Abstract Strategy Playground</title>
  <meta name="description" content="{{pitch}}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1117'/%3E%3Ccircle cx='11' cy='16' r='6' fill='%23f2b441'/%3E%3Ccircle cx='21' cy='16' r='6' fill='%234fd1c5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <main class="wrap wide">
    <nav><a href="../../">&larr; All games</a></nav>
    <h1>{{title}}</h1>
    <p class="lede">{{pitch}}</p>
    <div class="stage" style="aspect-ratio: {{width}} / {{height}}; width: min(100%, {{width}}px, calc(85vh * {{width}} / {{height}}));">
      <iframe src="play/" title="{{title}}" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
    </div>
    <p class="hint">Click the game once so it receives keyboard input. <a href="play/">Open it full page</a>.</p>
    <section class="rules">
{{rules}}
    </section>
    <footer>{{credit}}<a href="{{source_url}}">Source code</a></footer>
  </main>
</body>
</html>
